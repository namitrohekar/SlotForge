# Database tests only. They use slotforge_test and never touch slotforge.
spring.datasource.url=${SLOTFORGE_TEST_DB_URL:jdbc:postgresql://localhost:5432/slotforge_test}

# Rebuild slotforge_test from the real migration scripts before Hibernate validates it.
# The separator sends each file whole, because scripts contain DO blocks with semicolons inside.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:reset-test-database.sql,file:../database/migrations/V*.sql
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
