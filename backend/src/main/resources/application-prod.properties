# Production: session cookies only travel over HTTPS
server.servlet.session.cookie.secure=true

# The host terminates HTTPS and forwards the request, so trust its forwarded headers for the scheme and address.
server.forward-headers-strategy=framework

# A free database allows few connections, and one server needs only a handful.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# A free database sleeps when idle and takes a few seconds to wake.
spring.datasource.hikari.connection-timeout=20000

# Few people use it at once, and every thread costs memory on a 512 MB instance.
server.tomcat.threads.max=20
