# Real Google sign-in, added with the google profile. Startup fails if the client values are missing.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${slotforge.frontend-origin}/login/oauth2/code/google

# Workspace domains from the token's hd claim, comma separated. Each also covers its subdomains. Empty rejects everyone.
slotforge.google.allowed-domains=${SLOTFORGE_GOOGLE_ALLOWED_DOMAINS:}
