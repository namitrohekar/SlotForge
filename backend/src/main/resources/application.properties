#Application
spring.application.name=SlotForge
server.port=8080

# Local values live in backend/.env, which Git ignores. See .env.example.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${SLOTFORGE_DB_URL:jdbc:postgresql://localhost:5432/slotforge}
spring.datasource.username=${SLOTFORGE_DB_USERNAME:slotforge}
spring.datasource.password=${SLOTFORGE_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000

# Hibernate only checks the schema. Changes come from database/migrations, run by hand.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie: JavaScript cannot read it. Lax, not Strict, so a sign-in redirect keeps the session.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Paged lists
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# SlotForge configuration
slotforge.frontend-origin=http://localhost:5173
slotforge.schema.required-version=14
