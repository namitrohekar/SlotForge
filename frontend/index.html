<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100F0E" media="(prefers-color-scheme: dark)" />
    <title>SlotForge</title>
    <script>
      // Runs before first paint, so the page never flashes the wrong theme.
      ;(function () {
        var theme = 'system'
        try {
          theme = JSON.parse(localStorage.getItem('slotforge-preferences')).state.theme || 'system'
        } catch (e) {
          theme = 'system'
        }
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
